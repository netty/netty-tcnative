name: Build project

on:
  push:
    branches: [ main ]

  schedule:
    - cron: '30 3 * * 1'  # At 03:30 on Monday, every Monday.

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

# Cancel running jobs when a new push happens to the same branch as otherwise it will
# tie up too many resources without providing much value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - setup: centos6-x86_64
            docker-compose-run: "-f docker/docker-compose.centos-6.yaml -f docker/docker-compose.centos-6.18.yaml run build"
            docker-bake-args: "-f docker-compose.centos-6.yaml -f docker-compose.centos-6.18.yaml"
          - setup: debian7-x86_64
            docker-compose-run: "-f docker/docker-compose.debian.yaml -f docker/docker-compose.debian-7.18.yaml run build-dynamic-only"
            docker-bake-args: "-f docker-compose.debian.yaml -f docker-compose.debian-7.18.yaml"
          - setup: centos7-aarch64
            docker-compose-run: "-f docker/docker-compose.centos-7.yaml run cross-compile-aarch64-build"
            docker-bake-args: "-f docker-compose.centos-7.yaml"
          - setup: al2023-x86_64-aws_lc
            docker-compose-run: "-f docker/docker-compose.al2023.yaml run build"
            docker-bake-args: "-f docker-compose.al2023.yaml"

    name: ${{ matrix.setup }}
    permissions:
      contents: read
      packages: write  # to push the docker build cache to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The docker-compose*.yaml files push/pull their build cache to
      # ghcr.io/netty/netty-tcnative-build-cache (distinct from netty/netty's own
      # ghcr.io/netty/netty-build-cache, so the two repos' caches never collide).
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache .m2/repository
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: build-${{ matrix.setup }}-m2-repository-cache-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            build-${{ matrix.setup }}-m2-repository-cache-

      - name: Extract OpenSSL version from pom.xml
        run: echo "OPENSSL_VERSION=$(./mvnw -q -Dexpression=opensslVersion -DforceStdout -N help:evaluate --no-transfer-progress)" >> $GITHUB_ENV

      - name: Extract OpenSSL SHA256 from pom.xml
        run: echo "OPENSSL_SHA256=$(./mvnw -q -Dexpression=opensslSha256 -DforceStdout -N help:evaluate --no-transfer-progress)" >> $GITHUB_ENV

      - name: Build docker image
        working-directory: docker
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        run: docker buildx bake ${{ matrix.docker-bake-args }} --load

      - name: Build project
        run: docker compose ${{ matrix.docker-compose-run }} | tee build.output

      - name: Checking for test failures
        run: ./.github/scripts/check_build_result.sh build.output

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: build-${{ matrix.setup }}-jars
          path: |
            **/target/*.jar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: build-${{ matrix.setup }}-target
          path: |
            **/target/surefire-reports/
            **/hs_err*.log


  build-windows:
    runs-on: windows-2022
    name: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 8
          distribution: zulu

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Configuring Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86_amd64

      - name: Install tools
        uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
        with:
          args: install ninja nasm

      # Cache .m2/repository
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: build-windows-m2-repository-cache-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            build-windows-m2-repository-cache-

      - name: Build netty-tcnative-boringssl-static
        run: ./mvnw.cmd --file pom.xml -am -pl boringssl-static clean package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: build-windows-jars
          path: |
            **/target/*.jar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: build-windows-target
          path: |
            **/target/surefire-reports/
            **/hs_err*.log

  # Same verification as ci-pr.yml, on the same legs. See docs/musl-compatibility.md.
  musl-verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both runners are pinned: there is no ubuntu-latest-arm, so pairing ubuntu-latest with
          # a pinned arm label would drift apart as soon as ubuntu-latest moves on.
          - setup: alpine-x86_64
            os: ubuntu-24.04
            jars: build-centos6-x86_64-jars
            variant: bare
            extra-pkgs: ""
            drop-elftools: "1"
            build-service: runtime-setup
            run-service: verify
          - setup: alpine-aarch64
            os: ubuntu-24.04-arm
            jars: build-centos7-aarch64-jars
            variant: bare
            extra-pkgs: ""
            drop-elftools: "1"
            build-service: runtime-setup
            run-service: verify
          # The invariant leg: an Alpine JDK that ships no `libgcc` package of its own, so
          # `apk del .elftools` really does leave libgcc absent. eclipse-temurin's JDK depends on
          # libgcc, so the bare legs above cannot prove the artifact loads without it.
          - setup: alpine-x86_64-nolibgcc
            os: ubuntu-24.04
            jars: build-centos6-x86_64-jars
            variant: nolibgcc
            extra-pkgs: ""
            drop-elftools: "1"
            jdk-image: amazoncorretto:21-alpine
            build-service: runtime-setup
            run-service: verify
          - setup: alpine-aarch64-nolibgcc
            os: ubuntu-24.04-arm
            jars: build-centos7-aarch64-jars
            variant: nolibgcc
            extra-pkgs: ""
            drop-elftools: "1"
            jdk-image: amazoncorretto:21-alpine
            build-service: runtime-setup
            run-service: verify
          - setup: alpine-x86_64-gcompat
            os: ubuntu-24.04
            jars: build-centos6-x86_64-jars
            variant: gcompat
            extra-pkgs: gcompat
            drop-elftools: "0"
            build-service: runtime-setup
            run-service: verify
          - setup: alpine-aarch64-gcompat
            os: ubuntu-24.04-arm
            jars: build-centos7-aarch64-jars
            variant: gcompat
            extra-pkgs: gcompat
            drop-elftools: "0"
            build-service: runtime-setup
            run-service: verify
          - setup: glibc-control-x86_64
            os: ubuntu-24.04
            jars: build-centos6-x86_64-jars
            variant: glibc-control
            extra-pkgs: ""
            drop-elftools: "0"
            build-service: control-runtime-setup
            run-service: control-verify

    runs-on: ${{ matrix.os }}
    name: musl-verify ${{ matrix.setup }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.jars }}
          path: musl-verify-jars

      - name: Build verification image
        env:
          MUSL_VARIANT: ${{ matrix.variant }}
          MUSL_EXTRA_PKGS: ${{ matrix.extra-pkgs }}
          MUSL_JDK_IMAGE: ${{ matrix.jdk-image }}
        run: docker compose -f docker/docker-compose.alpine.yaml build ${{ matrix.build-service }}

      - name: Verify the artifact under ${{ matrix.variant }}
        env:
          MUSL_VARIANT: ${{ matrix.variant }}
          MUSL_EXTRA_PKGS: ${{ matrix.extra-pkgs }}
          MUSL_DROP_ELFTOOLS: ${{ matrix.drop-elftools }}
          MUSL_JDK_IMAGE: ${{ matrix.jdk-image }}
          MUSL_JARS_DIR: musl-verify-jars
        run: docker compose -f docker/docker-compose.alpine.yaml run --rm ${{ matrix.run-service }}
